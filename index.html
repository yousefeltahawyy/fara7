<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <!-- =====================================================
         BASIC META
    ====================================================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>دعوة عقد قران أحمد وأسـيل | Ahmed & Aseel</title>

    <meta name="description"
          content="دعوة عقد قران أحمد هشام فتحي وأسـيل أشرف الطحاوي">

    <meta name="author"
          content="Yousef Ashraf">

    <meta name="theme-color"
          content="#f8f0e6">

    <meta name="robots"
          content="index,follow">


    <!-- =====================================================
         OPEN GRAPH — WHATSAPP / FACEBOOK
    ====================================================== -->

    <meta property="og:type"
          content="website">

    <meta property="og:title"
          content="Ahmed & Aseel | Wedding Invitation">

    <meta property="og:description"
          content="نتشرف بدعوتكم لحضور عقد قران أحمد هشام فتحي وأسـيل أشرف الطحاوي">

    <meta property="og:url"
          content="https://yousefeltahawyy.github.io/fara7/">

    <meta property="og:site_name"
          content="Ahmed & Aseel">

    <meta property="og:locale"
          content="ar_EG">

    <meta property="og:image"
          content="https://yousefeltahawyy.github.io/fara7/childhood.png">

    <meta property="og:image:secure_url"
          content="https://yousefeltahawyy.github.io/fara7/childhood.png">

    <meta property="og:image:type"
          content="image/png">

    <meta property="og:image:width"
          content="900">

    <meta property="og:image:height"
          content="764">

    <meta property="og:image:alt"
          content="أحمد وأسـيل">


    <!-- =====================================================
         TWITTER CARD
    ====================================================== -->

    <meta name="twitter:card"
          content="summary_large_image">

    <meta name="twitter:title"
          content="Ahmed & Aseel | Wedding Invitation">

    <meta name="twitter:description"
          content="نتشرف بدعوتكم لحضور عقد قران أحمد هشام فتحي وأسـيل أشرف الطحاوي">

    <meta name="twitter:image"
          content="https://yousefeltahawyy.github.io/fara7/childhood.png">

    <meta name="twitter:image:alt"
          content="أحمد وأسـيل">


    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link rel="icon"
          type="image/png"
          href="./childhood.png">


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Marhey:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <!-- =====================================================
         MAIN CSS
    ====================================================== -->

    <link rel="stylesheet"
          href="./style.css">

</head>


<body>


    <!-- =====================================================
         PRELOADER
    ====================================================== -->

    <div id="preloader">

        <div class="preloader-content">

            <div class="preloader-names">
                أحمد <span>&</span> أسيل
            </div>

            <div class="preloader-line"></div>

            <div class="preloader-subtitle">
                دعوة عقد القران
            </div>

        </div>

    </div>


    <!-- =====================================================
         OPENING SCREEN
    ====================================================== -->

    <section id="opening-screen">

        <div class="opening-content">

            <div class="envelope"
                 id="envelope">


                <!-- Envelope Back -->

                <div class="envelope-back"></div>


                <!-- Letter -->

                <div class="letter">

                    <div class="letter-decoration"></div>

                    <span>
                        أحمد & أسيل
                    </span>

                </div>


                <!-- Envelope Body -->

                <div class="envelope-body">

                    <div class="envelope-inner"></div>

                </div>


                <!-- Envelope Flap -->

                <div class="flap"></div>


                <!-- Seal / Open Button -->

                <button
                    class="seal"
                    id="openSeal"
                    aria-label="فتح الدعوة"
                    type="button">

                    <span>♥</span>

                </button>

            </div>


            <!-- Tap Text -->

            <p class="tap-text">
                اضغط لفتح الدعوة
            </p>

        </div>

    </section>


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main id="main-content">


        <!-- =================================================
             CHILDHOOD IMAGE
        ================================================== -->

        <section class="childhood-section">

            <div class="image-card childhood-card">

                <img
                    src="./childhood.png"
                    alt="أحمد وأسـيل"
                    loading="eager">

            </div>

        </section>


        <!-- =================================================
             INVITATION IMAGE
        ================================================== -->

        <section class="invitation-section">

            <div class="image-card invitation-card">

                <img
                    src="./invitation.png"
                    alt="دعوة عقد قران أحمد وأسـيل"
                    loading="lazy">

            </div>

        </section>


        <!-- =================================================
             QUOTE
        ================================================== -->

        <section class="quote-section">

            <div class="quote-card">

                <div class="quote-mark">
                    ❝
                </div>

                <h2>
                    إن السرور إذا تشارك<br>
                    ضوعفت بسماته<br>
                    مع زمرة الأحبة
                </h2>

                <div class="quote-line"></div>

            </div>

        </section>


        <!-- =================================================
             COUNTDOWN
        ================================================== -->

        <section class="countdown-section">

            <div class="countdown-card">

                <h2>
                    باقي على الموعد
                </h2>

                <div class="gold-line"></div>


                <div class="countdown">

                    <div class="time-box">

                        <span id="days">
                            00
                        </span>

                        <small>
                            يوم
                        </small>

                    </div>


                    <div class="time-box">

                        <span id="hours">
                            00
                        </span>

                        <small>
                            ساعة
                        </small>

                    </div>


                    <div class="time-box">

                        <span id="minutes">
                            00
                        </span>

                        <small>
                            دقيقة
                        </small>

                    </div>


                    <div class="time-box">

                        <span id="seconds">
                            00
                        </span>

                        <small>
                            ثانية
                        </small>

                    </div>

                </div>

            </div>

        </section>


        <!-- =================================================
             LOCATION
        ================================================== -->

        <section class="location-section">

            <div class="location-card">

                <div class="location-icon">
                    ✦
                </div>

                <h2>
                    مكان عقد القران
                </h2>

                <h3>
                    مسجد الشرطة — قاعة الرزاق
                </h3>

                <div class="event-date">
                    <div>يوم الجمعة 18 سبتمبر 2026</div>
                    <div>في تمام الساعة التاسعة مساءً</div>
                </div>

                <a
                    class="location-btn"
                    href="https://maps.app.goo.gl/t6Jdpv6UPRF5b7Un6"
                    target="_blank"
                    rel="noopener noreferrer">

                    فتح الموقع

                </a>

            </div>

        </section>


    </main>


    <!-- =====================================================
         BACKGROUND MUSIC
    ====================================================== -->

    <audio
        id="bgMusic"
        preload="auto"
        loop
        playsinline
        webkit-playsinline>

        <source
            src="./aseel.mp3"
            type="audio/mpeg">

        Your browser does not support HTML5 audio.

    </audio>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="./script.js?v=2"></script>

</body>

</html>
